name: Generate and Deploy JSON Schema Docs

on:
  push:
    branches:
      - main
    paths:
      - 'testtaker.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install json-schema-for-humans
        run: |
          python -m pip install --upgrade pip
          pip install json-schema-for-humans

      - name: Generate HTML Documentation
        run: |
          rm -rf public
          mkdir -p public

          generate-schema-doc testtaker.json public/index.html

          python -c '
          style = """<style>
          table, .table, tbody, tr, td, th {
              table-layout: auto !important;
              max-width: 100% !important;
              width: auto !important;
              text-align: left !important;
          }
          * {
              white-space: normal !important;
              word-break: break-word !important;
              overflow-wrap: anywhere !important;
              text-align: left !important;
          }
          code, pre, .badge, .default-value {
              display: inline-block !important;
              max-width: 100% !important;
              white-space: pre-wrap !important;
              text-align: left !important;
          }
          </style>"""
          with open("public/index.html", "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("</head>", style + "\n</head>")
          with open("public/index.html", "w", encoding="utf-8") as f:
              f.write(content)
          '
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4