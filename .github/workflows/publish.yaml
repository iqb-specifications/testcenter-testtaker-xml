on:
  workflow_dispatch:
  release:
    types: [published]

name: Generate Html und Publish

jobs:
  deploy-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run html generation
        run: |
          npm ci
          npm run generate_docs
          # Stellt sicher, dass der Output-Ordner für Pages bereitsteht

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public' # Ersetzen Sie 'public' durch den Ordner, in den 'generate_docs' baut

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4